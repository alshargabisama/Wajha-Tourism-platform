<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>وجهة | تسجيل الدخول</title>

    <!-- Google Fonts -->

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

    <!-- CSS -->

    <link rel="stylesheet" href="styles/login.css">

</head>

<body>

    <div class="login-container">

        <!-- LEFT SIDE -->

        <div class="left-side">

            <div class="overlay-content">

                <div class="brand">

                    <span>WAJHA</span>

                    <h1>وجهة</h1>

                </div>

                <h2>
                    اكتشف روح اليمن
                    <br>
                    بين التراث والأفق
                </h2>

                <p>
                    منصة سياحية حديثة توفر لك تجربة سفر متكاملة
                    مع رحلات منظمة وباقات مصممة بعناية.
                </p>

            </div>

        </div>

        <!-- RIGHT SIDE -->

        <div class="right-side">

            <div class="top-text">

                <h2>
                    تسجيل الدخول
                </h2>

                <p>
                    قم بتسجيل الدخول للوصول إلى رحلاتك.
                </p>

            </div>

            <form id="loginForm">

                <div class="form-group">

                    <label>
                        البريد الإلكتروني
                    </label>

                    <div class="input-box">

                        <input type="email"
                            id="email"
                            placeholder="example@email.com"
                            required>

                        <i class="fa-solid fa-envelope"></i>

                    </div>

                </div>

                <div class="form-group">

                    <label>
                        كلمة المرور
                    </label>

                    <div class="input-box">

                        <input type="password"
                            id="password"
                            placeholder="********"
                            required>

                        <i class="fa-solid fa-lock"></i>

                    </div>

                </div>

                <div class="options">

                    <label>
                        <input type="checkbox">
                        تذكرني
                    </label>

                    <a href="#">
                        نسيت كلمة المرور؟
                    </a>

                </div>

                <button type="submit"
                    class="login-btn">

                    تسجيل الدخول

                </button>

            </form>

            <div class="divider">

                <span>
                    أو المتابعة باستخدام
                </span>

            </div>

            <div class="social-buttons">

                <button class="social-btn">

                    <i class="fa-brands fa-google"></i>

                    Google

                </button>

                <button class="social-btn">

                    <i class="fa-brands fa-facebook-f"></i>

                    Facebook

                </button>

            </div>

            <div class="register">

                ليس لديك حساب؟

                <a href="#">
                    إنشاء حساب
                </a>

            </div>

        </div>

    </div>

    <!-- JS -->
    <script src="javascript/login.js"></script>

</body>

</html>
